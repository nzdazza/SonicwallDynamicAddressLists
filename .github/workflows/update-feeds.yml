name: Update SonicWall DEAG feeds

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */12 * * *"

permissions:
  contents: write

concurrency:
  group: update-deag-feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate and validate feeds
        run: python3 scripts/generate_feeds.py

      - name: Commit changed feeds
        run: |
          if git diff --quiet -- feeds/; then
            echo "No feed changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/
          git commit -m "Update SonicWall DEAG feeds"
          git push
